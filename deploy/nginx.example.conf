# Пример Nginx reverse-proxy для Intro Show CRM
# Скопировать: sudo cp deploy/nginx.example.conf /etc/nginx/sites-available/introshow
# Затем: sudo ln -s /etc/nginx/sites-available/introshow /etc/nginx/sites-enabled/
# SSL: sudo certbot --nginx -d crm.example.com
#
# Замените crm.example.com на ваш домен.

upstream introshow_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.example.com;

    # После certbot этот блок обычно редиректит на HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.example.com;

    # Пути подставит certbot, либо укажите свои сертификаты:
    # ssl_certificate     /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

    client_max_body_size 32m;

    location / {
        proxy_pass http://introshow_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
