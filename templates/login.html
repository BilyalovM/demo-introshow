<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Intro Show CRM</title>
    <meta name="theme-color" content="#e25a3c">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/img/icon-192.png">
    <link rel="apple-touch-icon" href="/static/img/icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "DM Sans", sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f4f3f1;
            background-image:
                radial-gradient(900px 500px at 90% -10%, rgba(247, 133, 97, 0.18), transparent 58%),
                radial-gradient(700px 420px at -5% 100%, rgba(210, 35, 42, 0.08), transparent 55%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(51, 54, 63, 0.02) 2px, rgba(51, 54, 63, 0.02) 3px);
            color: #33363f;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border: 1px solid #e2ddd6;
            border-radius: 14px;
            padding: 36px 32px;
            box-shadow: 0 10px 28px rgba(51, 54, 63, 0.08);
            animation: modalIn 0.22s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: none; }
        }
        .logo {
            display: flex;
            justify-content: center;
            margin: 0 auto 22px;
        }
        .logo img {
            height: 48px;
            width: auto;
            max-width: 220px;
            object-fit: contain;
        }
        h1 {
            font-family: "Outfit", "DM Sans", sans-serif;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            letter-spacing: -0.02em;
        }
        .subtitle { text-align: center; color: #8b909a; font-size: 14px; margin: 6px 0 26px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #5c616c; margin-bottom: 7px; }
        input {
            width: 100%;
            padding: 11px 13px;
            background: #faf9f7;
            border: 1px solid #e2ddd6;
            border-radius: 9px;
            color: #33363f;
            font-size: 14.5px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus { border-color: #e25a3c; box-shadow: 0 0 0 3px rgba(226, 90, 60, 0.18); }
        .field { margin-bottom: 16px; }
        .error {
            display: none;
            background: #fde8e8;
            border: 1px solid rgba(210, 35, 42, 0.28);
            color: #b91c1c;
            font-size: 13.5px;
            padding: 10px 14px;
            border-radius: 9px;
            margin-bottom: 16px;
        }
        .error.show { display: block; }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #e25a3c;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.15s, transform 0.15s;
        }
        button:hover { background: #c9442a; }
        button:disabled { opacity: 0.6; cursor: wait; }
        .footer { text-align: center; color: #8b909a; font-size: 12.5px; margin-top: 22px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <img src="/static/img/introshow_logo.png" alt="Intro Show">
        </div>
        <h1>Вход в CRM</h1>
        <p class="subtitle">Intro Show — аренда звука, света и сцены</p>

        <form id="login-form">
            <div class="field">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <div id="error-message" class="error"></div>
            <button type="submit" id="submit-btn">Войти</button>
        </form>
        <p class="footer">Алматы</p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const err = document.getElementById('error-message');
            btn.disabled = true;
            err.classList.remove('show');
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    body: new FormData(e.target)
                });
                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    window.location.href = '/';
                } else {
                    err.textContent = data.error || 'Неверный логин или пароль';
                    err.classList.add('show');
                }
            } catch {
                err.textContent = 'Сервер недоступен. Попробуйте ещё раз.';
                err.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
