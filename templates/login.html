<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Intro Show CRM</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="/static/manifest.json">
    <link rel="icon" type="image/png" href="/static/img/icon-192.png">
    <link rel="apple-touch-icon" href="/static/img/icon-192.png">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            background-image:
                radial-gradient(900px 500px at 85% -10%, rgba(124, 58, 237, 0.25), transparent 60%),
                radial-gradient(800px 500px at -10% 110%, rgba(37, 99, 235, 0.25), transparent 55%);
            color: #f8fafc;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 40px 36px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.45);
        }
        .logo {
            width: 52px; height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; font-weight: 800;
            margin: 0 auto 20px;
            box-shadow: 0 12px 32px rgba(37, 99, 235, 0.4);
        }
        h1 { font-size: 24px; font-weight: 700; text-align: center; letter-spacing: -0.02em; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin: 6px 0 28px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #cbd5e1; margin-bottom: 7px; }
        input {
            width: 100%;
            padding: 12px 14px;
            background: rgba(15, 23, 42, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 12px;
            color: #f8fafc;
            font-size: 14.5px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25); }
        .field { margin-bottom: 18px; }
        .error {
            display: none;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            font-size: 13.5px;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
        }
        .error.show { display: block; }
        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.35);
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
        }
        button:hover { transform: translateY(-1px); box-shadow: 0 16px 36px rgba(37, 99, 235, 0.45); }
        button:disabled { opacity: 0.6; cursor: wait; transform: none; }
        .footer { text-align: center; color: #64748b; font-size: 12.5px; margin-top: 24px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">IS</div>
        <h1>Добро пожаловать</h1>
        <p class="subtitle">Войдите в CRM Intro Show</p>

        <form id="login-form">
            <div class="field">
                <label for="username">Имя пользователя</label>
                <input type="text" id="username" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="current-password" required>
            </div>
            <div id="error-message" class="error"></div>
            <button type="submit" id="submit-btn">Войти</button>
        </form>
        <p class="footer">Intro Show — аренда звука, света и сцены</p>
    </div>

    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            const err = document.getElementById('error-message');
            btn.disabled = true;
            err.classList.remove('show');
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    body: new FormData(e.target)
                });
                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    window.location.href = '/';
                } else {
                    err.textContent = data.error || 'Неверный логин или пароль';
                    err.classList.add('show');
                }
            } catch {
                err.textContent = 'Сервер недоступен. Попробуйте ещё раз.';
                err.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
